const majorNames=['愚者','魔术师','女祭司','皇后','皇帝','教皇','恋人','战车','力量','隐者','命运之轮','正义','倒吊人','死神','节制','恶魔','高塔','星星','月亮','太阳','审判','世界'];

const catalog=majorNames.map((name,i)=>({id:'major-'+String(i).padStart(2,'0'),name,keyword:majorKeys[i],n:i}));
suits.forEach((s,si)=>ranks.forEach((r,i)=>catalog.push({id:s[0]+'-'+String(i+1).padStart(2,'0'),name:s[1]+r,keyword:s[2],n:22+si*14+i})));
let db={readings:[],consent:false},current=null,view='home',busy=false,streamTimer=null,toastTimer=null,historyFilter='all',historyQuery='';
let activeSlot=null,fanRotation=0,fanScale=1,fanPan={x:0,y:0},fanDrag=null,fanSuppressUntil=0,arrivalSlot=null,flightSlot=null,revealing=false,shuffleRun=0,fanFrame=null;

function rand(n){const limit=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
function makeDeck(){const a=catalog.map(c=>({id:c.id,reversed:rand(2)===1}));for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function orbit(){return '<svg class="orbit" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#d9bd82" stroke-width=".7"><circle cx="60" cy="60" r="43"/><ellipse cx="60" cy="60" rx="27" ry="52" transform="rotate(30 60 60)"/><path d="M20 60h80M60 9v102"/></g><path fill="#d9bd82" d="m60 38 6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/><circle cx="96" cy="39" r="3" fill="#d9bd82"/></svg>'}
function backArt(){return '<svg viewBox="0 0 100 150" aria-hidden="true"><g fill="none" stroke="#d9bd82" stroke-width=".6"><rect x="6" y="6" width="88" height="138" rx="3"/><rect x="10" y="10" width="80" height="130" rx="2"/><circle cx="50" cy="75" r="30"/><ellipse cx="50" cy="75" rx="19" ry="45"/><path d="M50 18v114M16 75h68M25 32l50 86M75 32l-50 86"/></g><path fill="#d9bd82" d="m50 53 5 17 17 5-17 5-5 17-5-17-17-5 17-5z"/><g fill="#d9bd82"><circle cx="22" cy="23" r="1.5"/><circle cx="78" cy="127" r="1.5"/><circle cx="78" cy="23" r="1"/><circle cx="22" cy="127" r="1"/></g></svg>'}
function faceArt(n){const a=n%4,center=a===0?'<circle cx="50" cy="56" r="21" fill="#b88d4c"/><circle cx="59" cy="49" r="19" fill="#f1e7d2"/>':a===1?'<path d="M50 30 57 49 77 56 57 63 50 82 43 63 23 56 43 49Z" fill="#b88d4c"/>':a===2?'<circle cx="50" cy="56" r="20" fill="none" stroke="#b88d4c" stroke-width="2"/><path d="M30 90 50 37 70 90Z" fill="none" stroke="#536d72" stroke-width="2"/>':'<path d="M50 28 75 58 50 90 25 58Z" fill="none" stroke="#536d72" stroke-width="2"/><circle cx="50" cy="58" r="12" fill="#b88d4c"/>';return '<svg viewBox="0 0 100 120" aria-hidden="true"><g fill="none" stroke="#b88d4c" stroke-width=".7"><path d="M10 105V25Q50-10 90 25v80M15 101h70M18 16l64 88M82 16 18 104"/><circle cx="50" cy="58" r="34"/></g>'+center+'<g fill="#536d72"><circle cx="21" cy="25" r="1.5"/><circle cx="79" cy="25" r="1.5"/><path d="m50 8 2 5-2 5-2-5z"/></g></svg>'}
function face(c){const x=card(c.id);return '<div class="face '+(c.reversed?'reversed':'')+'"><span class="roman">'+(x.n<22?String(x.n).padStart(2,'0'):'✦')+'</span>'+faceArt(x.n)+'<span class="card-name">'+esc(x.name)+'</span></div>'}

function scatterPose(i){const fraction=n=>n-Math.floor(n);return {x:Math.round((fraction(Math.sin(i*12.9898+1)*43758.5453)-.5)*218),y:Math.round((fraction(Math.sin(i*78.233+7)*19341.713)-.5)*190)}}
function scatter(){return '<div class="scatter-table" aria-label="散铺的塔罗牌桌">'+Array.from({length:32},(_,i)=>{const {x,y}=scatterPose(i);return '<div class="back scatter-card" style="--sx:'+x+'px;--sy:'+y+'px;--sr:'+((i*67+shuffleRun*23)%170-85)+'deg">'+backArt()+'</div>'}).join('')+'</div>'}
function lockRitual(){busy=true;$('.device').setAttribute('aria-busy','true');document.querySelectorAll('.ritual-page button,.ritual-page input,.topbar button').forEach(el=>el.disabled=true)}

async function washDeck(){
 if(drawnCount())return;
 const previous={deck:current.deck,reversals:current.reversals,remaining:current.remaining,cutApplied:current.cutApplied,cutOrder:current.cutOrder,updatedAt:current.updatedAt};
 const next=makeDeck(),table=$('.scatter-table'),cards=[...table.children];
 lockRitual();
 const animations=cards.map((el,i)=>{
  const style=getComputedStyle(el),start=style.transform,w=el.offsetWidth;
  const pose=(x,y,r,scale)=>'translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px)) rotate('+r+'deg) scale('+scale+')';
  const scale=48/w,{x,y}=scatterPose(i);
  const frames=[{transform:start,offset:0},{transform:pose(-y*.95,x*.75,(i*83)%240-120,scale),offset:.33},{transform:pose(x*.8,-y,(i*41)%200-100,scale),offset:.68},{transform:pose(x,y,(i*67+(shuffleRun+1)*23)%170-85,scale),offset:1}];
  return el.animate(frames,{duration:reducedMotion()?100:1700,delay:reducedMotion()?0:i*4,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
 });
 try{await Promise.all(animations.map(a=>a.finished))}catch(e){}
 current.deck=next;current.reversals=true;current.remaining=[];current.cutApplied=false;current.cutOrder=null;shuffleRun++;fanRotation=0;
 if(!touch())Object.assign(current,previous);unlockRitual();render();
}
async function gatherToCut(){
 if(!current.deck.length)return;
 lockRitual();
 const table=$('.scatter-table'),cards=[...table.children];
 const animations=cards.map((el,i)=>el.animate([{transform:getComputedStyle(el).transform},{transform:'translate(calc(-50% + '+((i%4-1.5)*.7)+'px),calc(-50% + '+((31-i)*.12)+'px)) rotate('+((i%5-2)*.3)+'deg) scale(2)'}],{duration:reducedMotion()?80:680,delay:reducedMotion()?0:i*5,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}));
 try{await Promise.all(animations.map(a=>a.finished))}catch(e){}
 const origin=table.getBoundingClientRect(),x=origin.left+origin.width/2,y=origin.top+origin.height/2;
 const previous=current.stage;current.stage='cut';
 if(!touch()){current.stage=previous;unlockRitual();render();return}
 const flying=document.createElement('div');flying.className='back flying-card';flying.innerHTML=backArt();flying.style.cssText='left:'+(x-48)+'px;top:'+(y-72)+'px;width:96px;height:144px';
 setView('cut');document.body.append(flying);$('.cut-deck').style.visibility='hidden';
 const target=$('.cut-deck').getBoundingClientRect();
 try{await flying.animate([{transform:'translate(0,0)'},{transform:'translate('+(target.left+target.width/2-x)+'px,'+(target.top+target.height/2-y)+'px)'}],{duration:reducedMotion()?80:360,easing:'cubic-bezier(.22,.7,.2,1)',fill:'forwards'}).finished}catch(e){}
 flying.remove();unlockRitual();render();
}
async function cutDeck(){
 if(drawnCount())return;
 const previous={cut:current.cut,cutOrder:current.cutOrder,remaining:current.remaining,cutApplied:current.cutApplied,updatedAt:current.updatedAt};
 const cut=18+rand(43),source=current.cutOrder||current.deck,next=[...source.slice(cut),...source.slice(0,cut)];
 const piles=[...document.querySelectorAll('.cut-pile')];
 lockRitual();
 const animations=piles.map((el,i)=>{el.style.zIndex=i?'2':'1';const sign=i?1:-1;return el.animate([{transform:'translate(0,0)'},{transform:'translate('+(sign*62)+'px,'+(i?-23:23)+'px) rotate('+(sign*5)+'deg)',offset:.32},{transform:'translate('+(-sign*50)+'px,'+(i?-32:32)+'px) rotate('+(-sign*3)+'deg)',offset:.68},{transform:'translate(0,0) rotate(0)'}],{duration:reducedMotion()?100:1050,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'})});
 try{await Promise.all(animations.map(a=>a.finished))}catch(e){}
 current.cutOrder=next;current.remaining=next.map((c,i)=>({...c,number:i+1}));current.cutApplied=true;current.cut=cut;fanRotation=0;
 if(!touch())Object.assign(current,previous);unlockRitual();render();
}

 }
 if(view==='ask'){

  if(d.id==='choice')s+='<div class="pair ask-options"><label class="field"><span>选项 A</span><input id="option-a" maxlength="100" value="'+esc(current.a)+'" placeholder="第一种选择"></label><label class="field"><span>选项 B</span><input id="option-b" maxlength="100" value="'+esc(current.b)+'" placeholder="另一种选择"></label></div>';

 }
 if(view==='draw'){
  const count=info().positions.length,full=drawnCount()===count;
  s='<div class="ritual-title"><h2>抽牌</h2></div>'+spread()+'<p class="draw-help">'+drawnCount()+' / '+count+'</p><div class="actions"><button class="primary" data-action="reveal" '+(!full?'disabled':'')+'>翻开我的牌</button></div>';

 if(busy)return;
 if(a==='direction'){current={id:uuid(),direction:b.dataset.id,question:'',context:'',a:'',b:'',reversals:true,deck:[],remaining:[],drawn:[],cut:39,messages:[],note:'',favorite:false,stage:'ask',createdAt:Date.now(),updatedAt:Date.now()};db.readings.unshift(current);if(touch())setView('ask')}
 if(a==='begin'){captureForm();const length=Array.from(current.question.trim()).length;if(length<5||length>800){toast('把问题写具体一点，5–800 字就好。');return}if(Array.from(current.context).length>1200){toast('补充背景最多写 1,200 字哦。');return}if(current.direction==='choice'&&(!current.a.trim()||!current.b.trim()||current.a.replace(/\s/g,'')===current.b.replace(/\s/g,''))){toast('写下两个不同的选项，再一起看看。');return}current.question=current.question.trim();current.stage='shuffle';if(touch())setView('shuffle')}
 if(a==='shuffle')void washDeck();
 if(a==='to-cut')void gatherToCut();
 if(a==='back-shuffle'){current.stage='shuffle';if(touch())setView('shuffle')}
 if(a==='back-cut'){current.stage='cut';if(touch())setView('cut')}
 if(a==='cut')void cutDeck();
 if(a==='to-draw'){if(!current.cutApplied&&!drawnCount())return;current.stage='draw';if(touch())setView('draw')}
 if(a==='open-fan')openFan(Number(b.dataset.index));
 if(a==='pick-fan')void pickFan(Number(b.dataset.index),b);
 if(a==='card-detail')cardDetail(Number(b.dataset.index));
 if(a==='reveal'){if(drawnCount()!==info().positions.length)return;current.stage='reveal';if(touch()){revealing=true;setView('reveal');busy=true;setTimeout(()=>{revealing=false;busy=false},reducedMotion()?100:1100)}}
 if(a==='to-chat')enterChat();
 if(a==='interpret')consent();
 if(a==='consent'){db.consent=true;save();$('#modal').close();simulate(makeInitial())}
 if(a==='local-meanings')setView('reveal');
 if(a==='suggest'){const input=$('#chat-input');if(input){input.value=b.dataset.text;input.focus()}}
 if(a==='favorite'){current.favorite=!current.favorite;touch();render()}
 if(a==='note'){openModal('<h3 id="modal-title">记下自己的声音</h3><p>这段笔记只在本机，不会进入 AI 对话。</p><textarea id="note-input" aria-label="个人笔记">'+esc(current.note)+'</textarea><div class="actions"><button class="primary" data-action="save-note">好好收下</button><button class="secondary" data-action="close">先不改</button></div>')}
 if(a==='save-note'){current.note=$('#note-input').value;if(Array.from(current.note).length>2000){toast('笔记最多写 2,000 字哦。');return}if(touch()){$('#modal').close();render();toast('笔记已经收好了。')}}
 if(a==='new')goHome();
 if(a==='open'){current=db.readings.find(r=>r.id===b.dataset.id);if(!current)return;setView(current.stage)}
 if(a==='filter'){historyFilter=b.dataset.id;render()}
 if(a==='delete'){const r=db.readings.find(x=>x.id===b.dataset.id);openModal('<h3 id="modal-title">真的要删掉这次星语吗？</h3><p>问题、抽到的牌、聊天和笔记都会从这个浏览器里删除。</p><div class="actions"><button class="primary" data-action="confirm-delete" data-id="'+r.id+'">删掉这次记录</button><button class="secondary" data-action="close">留着吧</button></div>')}
 if(a==='confirm-delete'){db.readings=db.readings.filter(r=>r.id!==b.dataset.id);if(current?.id===b.dataset.id)current=null;save();$('#modal').close();setView('history');toast('这次记录已经删掉了。')}
});
window.addEventListener('pagehide',()=>{if(view==='ask')captureForm();stopStream();save()});
// 原型载入时把上次没有完成的模拟流标为中断，历史打开不重新生成。
db.readings.forEach(r=>{r.messages.forEach(m=>{if(m.status==='streaming')m.status='interrupted'});if(r.remaining?.length){r.remaining=r.remaining.map((c,i)=>({...c,number:c.number??i+1}));if(['draw','reveal','chat'].includes(r.stage))r.cutApplied=true;}});
render();
</script>
</body>
</html>
